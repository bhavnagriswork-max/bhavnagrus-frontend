<!-- Floating AI Button -->
<div class="fixed bottom-8 right-8 z-[70] flex flex-col items-end gap-4">
  
  <!-- Chat Window -->
  <div *ngIf="chatVisible" class="w-[350px] md:w-[450px] max-h-[600px] glass-card rounded-[2.5rem] border border-bhavaccent/20 shadow-[0_0_100px_-20px_rgba(197,160,89,0.3)] overflow-hidden flex flex-col animate-slide-up">
    
    <!-- Header -->
    <div class="p-6 bg-bhavaccent/10 border-b border-bhavaccent/10 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-bhavaccent flex items-center justify-center shadow-lg shadow-bhavaccent/30 relative">
          <div class="absolute inset-[-4px] border border-bhavaccent/20 rounded-full animate-pulse-slow"></div>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-bhavdark" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div>
          <h3 class="text-sm font-playfair font-bold text-bhavtext">Heritage AI</h3>
          <p class="text-[8px] text-bhavaccent uppercase tracking-widest font-bold">Marketing Assistant</p>
        </div>
      </div>
      <button (click)="toggleChat()" class="text-bhavtext/30 hover:text-bhavaccent transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Messages Area -->
    <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar min-h-[300px]">
      <div *ngFor="let msg of messages" class="flex flex-col" [ngClass]="msg.role === 'user' ? 'items-end' : 'items-start'">
        <div class="max-w-[85%] px-5 py-4 rounded-3xl text-sm leading-relaxed shadow-sm"
          [ngClass]="msg.role === 'user' ? 'bg-bhavaccent text-bhavdark rounded-tr-none font-medium' : 'bg-white/5 border border-white/5 text-bhavtext/80 rounded-tl-none'">
          {{msg.text}}
        </div>

        <!-- AI Suggestion Card -->
        <div *ngIf="msg.hasAction" class="mt-4 w-full glass-card p-5 border-bhavaccent/30 animate-zoom-in">
          <div class="flex items-center gap-2 mb-3">
            <span class="text-[8px] px-2 py-0.5 bg-bhavaccent/20 text-bhavaccent rounded-full font-bold uppercase tracking-widest">{{msg.suggestion.type}}</span>
            <h4 class="text-xs font-bold text-bhavtext">{{msg.suggestion.title}}</h4>
          </div>
          <p class="text-[11px] text-bhavtext/50 mb-4">{{msg.suggestion.content}}</p>
          
          <div class="p-4 bg-bhavdark/40 border border-white/5 rounded-2xl relative group">
            <label class="text-[8px] absolute top-2 right-4 text-bhavaccent/50 uppercase font-bold tracking-widest">Suggested Ad Copy</label>
            <p class="text-[10px] text-bhavtext/80 italic pr-8 pt-4 leading-relaxed">{{msg.suggestion.adCopy}}</p>
            <button (click)="copyToClipboard(msg.suggestion.adCopy)" class="absolute bottom-2 right-2 p-2 text-bhavaccent/30 hover:text-bhavaccent transition-colors opacity-0 group-hover:opacity-100">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Typing Indicator -->
      <div *ngIf="loading" class="flex gap-1 p-2">
        <div class="w-1.5 h-1.5 bg-bhavaccent rounded-full animate-bounce"></div>
        <div class="w-1.5 h-1.5 bg-bhavaccent rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
        <div class="w-1.5 h-1.5 bg-bhavaccent rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
      </div>
    </div>

    <!-- Footer / Input -->
    <div class="p-6 border-t border-white/5 flex gap-3">
      <button (click)="showSuggestions()" class="flex-1 py-3 bg-bhavaccent text-bhavdark rounded-2xl text-[10px] font-bold uppercase tracking-widest hover:brightness-110 transition-all shadow-lg shadow-bhavaccent/20">
        Generate New Suggestions
      </button>
    </div>
  </div>

  <!-- Trigger Button -->
  <button (click)="toggleChat()" class="w-16 h-16 rounded-full bg-gradient-to-br from-bhavaccent to-yellow-600 flex items-center justify-center shadow-[0_10px_30px_rgba(197,160,89,0.4)] hover:scale-110 transition-all duration-500 group relative">
    <div class="absolute inset-[-4px] border-2 border-bhavaccent/30 rounded-full animate-pulse-slow"></div>
    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-bhavdark group-hover:rotate-12 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
    </svg>
    <!-- Notification Badge -->
    <div class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-bhavtext text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-bhavdark animate-bounce">
      1
    </div>
  </button>
</div>
