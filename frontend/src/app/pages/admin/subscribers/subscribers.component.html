<div class="p-4 md:p-8">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
    <div>
      <h2 class="text-3xl font-playfair font-bold text-bhavtext mb-1">Newsletter Subscribers</h2>
      <p class="text-bhavtext/40 text-sm">Manage your premium audience and export for campaigns.</p>
    </div>
    <div class="flex gap-3 w-full md:w-auto">
      <div class="relative flex-grow md:w-64">
        <input type="text" [(ngModel)]="searchTerm" placeholder="Search emails..." 
          class="w-full bg-bhavtext/5 border border-bhavtext/10 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-bhavaccent text-bhavtext">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 absolute right-3 top-2.5 text-bhavtext/30" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <button (click)="exportToCSV()" class="bg-bhavaccent/10 text-bhavaccent border border-bhavaccent/20 px-4 py-2 rounded-xl text-sm font-bold hover:bg-bhavaccent hover:text-bhavdark transition-all flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        Export
      </button>
    </div>
  </div>

  <!-- Subscribers Table -->
  <div class="glass-card rounded-[2rem] overflow-hidden border border-white/5">
    <div class="overflow-x-auto">
      <table class="w-full text-left">
        <thead>
          <tr class="border-b border-white/5 bg-white/5">
            <th class="px-8 py-5 text-[10px] uppercase tracking-[0.2em] font-bold text-bhavtext/40 w-12 text-center">#</th>
            <th class="px-8 py-5 text-[10px] uppercase tracking-[0.2em] font-bold text-bhavtext/40">Email Address</th>
            <th class="px-8 py-5 text-[10px] uppercase tracking-[0.2em] font-bold text-bhavtext/40">Subscribed On</th>
            <th class="px-8 py-5 text-[10px] uppercase tracking-[0.2em] font-bold text-bhavtext/40 text-right">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let subscriber of filteredSubscribers; let i = index" 
            class="border-b border-white/5 hover:bg-white/[0.02] transition-colors group">
            <td class="px-8 py-5 text-sm text-bhavtext/30 font-medium text-center">{{i + 1}}</td>
            <td class="px-8 py-5">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-bhavaccent/10 flex items-center justify-center text-bhavaccent text-xs font-bold">
                  {{subscriber.email[0].toUpperCase()}}
                </div>
                <span class="text-sm font-medium text-bhavtext/80">{{subscriber.email}}</span>
              </div>
            </td>
            <td class="px-8 py-5">
              <span class="text-sm text-bhavtext/40">{{subscriber.created_at | date:'mediumDate'}}</span>
            </td>
            <td class="px-8 py-5 text-right">
              <button (click)="deleteSubscriber(subscriber.id)" 
                class="text-red-400/50 hover:text-red-500 transition-all p-2 rounded-lg hover:bg-red-500/10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </td>
          </tr>
          <tr *ngIf="filteredSubscribers.length === 0 && !loading">
            <td colspan="4" class="px-8 py-20 text-center">
              <div class="flex flex-col items-center gap-4">
                <div class="w-16 h-16 rounded-full bg-white/5 flex items-center justify-center text-bhavtext/20">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                  </svg>
                </div>
                <p class="text-bhavtext/30 text-sm">No subscribers found</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="flex justify-center py-20">
    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-bhavaccent"></div>
  </div>
</div>
