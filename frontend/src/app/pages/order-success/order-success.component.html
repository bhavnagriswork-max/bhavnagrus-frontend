<div class="pt-40 pb-20 bg-bhavdark min-h-screen flex items-center justify-center relative overflow-hidden">
  
  <div class="absolute inset-0 bg-glow-gradient opacity-30 pointer-events-none"></div>

  <div class="max-w-2xl w-full px-6 relative z-10 text-center">
    
    <!-- Success Icon -->
    <div class="mb-12 flex justify-center">
      <div class="w-32 h-32 bg-bhavaccent/10 rounded-full flex items-center justify-center border border-bhavaccent/20 animate-pulse">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-bhavaccent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 13l4 4L19 7" />
        </svg>
      </div>
    </div>

    <h3 class="text-bhavaccent uppercase tracking-[0.4em] text-[10px] font-bold mb-6">Order Confirmed</h3>
    <h1 class="text-5xl md:text-7xl font-playfair font-bold text-bhavtext mb-10 uppercase tracking-tight leading-none">Victory of <br/> <span class="text-bhavtext/20">Taste.</span></h1>
    
    <div class="bg-white/5 backdrop-blur-2xl border border-white/10 p-10 rounded-3xl mb-12 relative overflow-hidden group">
      <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-bhavaccent" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
      </div>
      <p class="text-bhavtext/40 text-xs uppercase tracking-widest mb-4 font-bold">Your Order Reference</p>
      <h2 class="text-3xl font-bold text-bhavtext tracking-widest uppercase mb-8">#{{orderNumber}}</h2>
      <div class="h-px w-full bg-white/5 mb-8"></div>
      <p class="text-bhavaccent text-xs uppercase tracking-widest font-bold mb-4">Mission Accomplished</p>
      <p class="text-bhavtext/60 text-sm leading-relaxed max-w-md mx-auto">
        Your heritage treats are being prepared. <br> <span class="text-bhavtext font-bold italic">And because of you, a stray dog is being fed today.</span>
      </p>
    </div>

    <div class="flex flex-col sm:flex-row gap-6 justify-center">
      <button routerLink="/my-orders" class="bg-white text-bhavdark px-10 py-5 rounded-full text-[10px] font-bold uppercase tracking-widest hover:bg-bhavaccent hover:text-bhavtext transition-all shadow-xl">
        View My Orders
      </button>
      <button routerLink="/" class="bg-white/5 border border-white/10 text-bhavtext px-10 py-5 rounded-full text-[10px] font-bold uppercase tracking-widest hover:bg-white/10 transition-all">
        Back to Home
      </button>
    </div>

    <p class="mt-16 text-[10px] text-bhavtext/20 uppercase tracking-widest font-medium">Thank you for choosing Bhavnagris</p>

  </div>
</div>
