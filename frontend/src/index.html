<body class="antialiased">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <div class="grain-overlay"></div>
  <app-root></app-root>

  <script>
    // Premium Reveal Observer
    const observerOptions = {
      threshold: 0.1,
      rootMargin: "0px 0px -50px 0px"
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('active');
          // observer.unobserve(entry.target); // Optional: keep observing if you want re-trigger
        }
      });
    }, observerOptions);

    window.addEventListener('load', () => {
      document.querySelectorAll('.reveal-up').forEach(el => observer.observe(el));
    });

    // Handle dynamic Angular content
    const mutationObserver = new MutationObserver((mutations) => {
      mutations.forEach(mutation => {
        mutation.addedNodes.forEach(node => {
          if (node.nodeType === 1) { // Element node
            if (node.classList?.contains('reveal-up')) observer.observe(node);
            node.querySelectorAll?.('.reveal-up').forEach(el => observer.observe(el));
          }
        });
      });
    });

    mutationObserver.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
